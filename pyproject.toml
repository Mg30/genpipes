[project]
name = "genpipes"
version = "3.0.0"
description = "Typed, lazy Python data pipelines using decorators and generators"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Matt G." }]
license-files = ["LICENSE"]
dependencies = []
keywords = ["pipelines", "generators", "data-engineering"]
classifiers = [
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Typing :: Typed",
]

[project.urls]
Repository = "https://github.com/Mg30/genpipes"
Issues = "https://github.com/Mg30/genpipes/issues"
Changelog = "https://github.com/Mg30/genpipes/blob/develop/CHANGELOG.md"

[dependency-groups]
dev = [
    "mypy>=2.4.1,<3",
    "pandas>=3.1,<4",
    "pytest>=9.2,<10",
    "pytest-cov>=6,<8",
    "ruff>=0.17.3,<0.18",
    "twine>=7,<8",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14"]
build-backend = "uv_build"

[tool.uv]
required-version = ">=0.13.6,<0.14"

[tool.uv.build-backend]
module-root = ""
source-include = ["tests/**", "examples/**", "docs/**", "CHANGELOG.md", "uv.lock"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["genpipes", "tests/typing", "examples"]
show_error_codes = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-config", "--strict-markers", "--import-mode=importlib"]

[tool.coverage.run]
source = ["genpipes"]
branch = true
