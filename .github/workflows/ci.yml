name: CI

on:
  pull_request:
  push:
    branches: [develop]
  workflow_call:

permissions:
  contents: read

jobs:
  quality:
    name: Lint and types
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .
      - run: uv run --locked mypy
      - run: uv run --locked python examples/quickstart.py

  tests:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run --locked pytest --cov --cov-report=term-missing

  package:
    name: Build and verify distributions
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
          python-version: "3.12"
      - run: uv sync --locked --no-install-project
      - run: uv build --no-sources
      - run: .venv/bin/twine check --strict dist/*
      - name: Install built wheel
        run: uv pip install --python .venv/bin/python --no-deps dist/*.whl
      - name: Test installed package outside the checkout
        run: |
          cp tests/typing/contracts.py "$RUNNER_TEMP/genpipes_typing_contracts.py"
          cd "$RUNNER_TEMP"
          "$GITHUB_WORKSPACE/.venv/bin/python" -m pytest "$GITHUB_WORKSPACE/tests"
          "$GITHUB_WORKSPACE/.venv/bin/mypy" --strict --python-version 3.12 genpipes_typing_contracts.py
      - name: Check release tag against built version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          .venv/bin/python - <<'PY'
          import os
          from importlib.metadata import version

          expected = f"v{version('genpipes')}"
          actual = os.environ["RELEASE_TAG"]
          if actual != expected:
              raise SystemExit(f"Tag {actual!r} must match package version {expected!r}")
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error
